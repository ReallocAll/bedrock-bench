[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bedrock-bench-bot"
version = "0.1.0.dev0"
description = "Installed protocol 2193 benchmark frontend for bedrock-bench"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["bedrock-bot==0.1.0", "psutil==7.2.2", "uvloop==0.23.0; platform_system == 'Linux'"]

[project.scripts]
bedrock-bench-bot = "bedrock_bench_bot.cli:main"

[project.optional-dependencies]
raknet = ["bedrock-bot[raknet]==0.1.0"]
test = ["pytest>=8", "jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_bench_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
